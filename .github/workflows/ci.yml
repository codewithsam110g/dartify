name: CI

on:
  push:
    branches: [main, refactor/orchestration]
  pull_request:

# Read-only token: no step here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - if: matrix.node == '24.x'
        run: pnpm test:coverage
      - if: matrix.node == '24.x'
        run: pnpm test:incremental

  dart:
    # The v1 acceptance test: generated bindings must pass `dart analyze`
    # against the categorized baseline, and the interop probes must run.
    # The SDK is pinned to the exact version of the baseline census; bump it
    # together with test/dart/baseline.json's comment (HD-08).
    name: Dart analyzer gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dart
      - run: pnpm test:e2e
