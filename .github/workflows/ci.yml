name: CI

on:
  push:
    branches: [main, refactor/orchestration]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - if: matrix.node == '24.x'
        run: pnpm test:coverage
      - if: matrix.node == '24.x'
        run: pnpm test:incremental

  dart:
    # The v1 acceptance test: generated bindings must pass `dart analyze`
    # against the categorized baseline, and the interop probes must run.
    name: Dart analyzer gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dart
      - run: pnpm test:e2e
